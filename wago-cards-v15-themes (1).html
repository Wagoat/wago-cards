<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAGO Cards</title>
<style>
:root{color-scheme:dark;--bg:#05060d;--pn:#0e1020;--pn2:#14172e;--ln:#232749;--tx:#f1eff3;--mu:#8a90b8;--ac:#7b8fd6;--ac2:#3b3f91;--ok:#34d399;--ko:#ff5470;--lc:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(900px 480px at 12% -8%,#2a2f78,transparent 60%),radial-gradient(700px 420px at 100% 0,#1a1e55,transparent 55%),var(--bg) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:46vw;height:46vw;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-2;animation:orb 18s ease-in-out infinite alternate}
body::before{background:#3b3f91;left:-12vw;top:30vh}body::after{background:#6b4fd6;right:-14vw;bottom:-10vh;animation-delay:-9s}
@keyframes orb{to{transform:translate(8vw,-10vh) scale(1.2)}}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
main{max-width:1000px;margin:auto;padding:16px}
h1,h2,h3{margin:0}h2{margin:4px 0 10px;font-size:20px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:9px 13px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
button{cursor:pointer;font-weight:600;transition:.15s}button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));border:0;color:#fff;box-shadow:0 6px 20px #3b3f9166}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px;font-size:18px}.lg img{width:42px;height:42px;border-radius:50%;border:2px solid var(--ac);background:#fff;box-shadow:0 0 18px #7b8fd688}
.pill{display:flex;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--ln);padding:6px 14px;border-radius:99px;font-weight:700}.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.18);border-color:#ffd166;box-shadow:0 0 20px #ffd16688}}
.coin{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#ffe08a,#e0a21b);display:inline-block;box-shadow:inset 0 0 0 2px #0003}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--pn);border:1px solid var(--ln);padding:5px;border-radius:14px;margin-bottom:16px;width:fit-content;max-width:100%}
nav button{border:0;background:transparent;color:var(--mu);white-space:nowrap}nav button.on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff}
#v{animation:vin .4s}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.p{background:linear-gradient(180deg,#14172ecc,#0e1020cc);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(6px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}.c{justify-content:center}
.mut{color:var(--mu);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.hero{border-radius:18px;padding:22px;margin-bottom:14px;background:linear-gradient(120deg,#2a2f78aa,#10122b99),radial-gradient(circle at 90% 0,#7b8fd655,transparent 60%);border:1px solid #3b3f91;position:relative;overflow:hidden}.hero h2{font-size:24px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.ct{--k:#7b8fd6;border-radius:18px;padding:18px;background:linear-gradient(160deg,#171b3d,#0c0e22);border:1px solid color-mix(in srgb,var(--k) 55%,#000);position:relative;overflow:hidden;transition:.25s}
.ct:hover{transform:translateY(-4px);box-shadow:0 14px 40px color-mix(in srgb,var(--k) 35%,transparent)}.ct::before{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:var(--k);opacity:.18;filter:blur(8px)}
.ct h3{font-size:20px;color:var(--k)}.pips{display:flex;gap:6px;margin:12px 0}.pips i{width:26px;height:8px;border-radius:5px;background:var(--ln)}.pips i.on{background:var(--k);box-shadow:0 0 10px var(--k)}
.card{--c:#9aa4b2;container-type:inline-size;position:relative;display:block;aspect-ratio:3/4;min-width:0;border-radius:12px;border:2px solid var(--c);overflow:hidden;background:#0a0b16;cursor:pointer;box-shadow:0 0 0 1px #000,0 8px 18px #000a,0 0 16px color-mix(in srgb,var(--c) 30%,transparent);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .4s cubic-bezier(.2,.8,.2,1);will-change:transform}
.card .art{position:absolute;inset:0;background:center/cover}.card .art.x{display:flex;align-items:center;justify-content:center;font-size:40cqw;font-weight:800;color:var(--c);background:linear-gradient(160deg,#242a68,#0a0b16)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#fff6,transparent 55%);mix-blend-mode:overlay;opacity:0;transition:.2s;pointer-events:none}.card:hover::after{opacity:1}
.card .ft{position:absolute;left:0;right:0;bottom:0;padding:18cqw 4cqw 4cqw;text-align:center;background:linear-gradient(transparent,#000e 60%)}
.ft b{display:block;font-size:max(9px,8cqw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ft small{color:var(--c);font-size:max(7px,4.6cqw);letter-spacing:.15em;text-transform:uppercase;font-weight:800}
.card .nb{position:absolute;top:4cqw;right:4cqw;background:#000b;border-radius:6px;padding:1px 5px;font-size:max(7px,5cqw);font-weight:700}
.card .rb{position:absolute;top:4cqw;left:4cqw;z-index:3;background:#000b;border:1px solid var(--c);color:var(--c);border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(6px,4.2cqw);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.card.bw{border-color:#fff;animation:bw 2s infinite alternate}.card.bw .art{filter:grayscale(.15)}.card.bw .ft{background:linear-gradient(transparent,#000f 60%)}
@keyframes bw{from{box-shadow:0 0 0 1px #000,0 0 8px #fff8}to{box-shadow:0 0 0 1px #fff,0 0 34px #fff}}
.slot{aspect-ratio:3/4;min-width:0;border-radius:12px;border:2px dashed #2a3068;background:#0a0c1c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a4378;font-weight:800;gap:2px;font-size:12px}.slot span{font-size:26px}.slot.off{border:0;background:none}
.bkw{perspective:1800px;margin:18px 0 40px}
.bk{position:relative;display:flex;gap:16px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#232a78,#0a0c26 60%);border:2px solid #4a57b8;transform:rotateX(var(--brx,12deg)) rotateY(var(--bry,0deg));transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 0 #151a58,0 4px 0 #101348,0 6px 0 #0c0f38,0 8px 0 #0a0c2c,0 10px 0 #070921,0 50px 80px #000e,inset 0 0 0 1px #9fb0ff33}
.bk::before{content:"";position:absolute;left:50%;margin-left:-8px;width:16px;top:22px;bottom:22px;z-index:4;background:radial-gradient(circle,#e8ecff 0 2px,#7b8fd6 3px 5px,transparent 6px) 0 0/16px 54px repeat-y;filter:drop-shadow(0 0 4px #7b8fd6)}
.pg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:12px;border-radius:10px;align-content:start;background:linear-gradient(90deg,#0b0d20,#10133a 70%,#06070f);box-shadow:inset 0 0 24px #000,0 0 0 1px #2a3068}
.pg+.pg,.leaf.pv .pg{background:linear-gradient(270deg,#0b0d20,#10133a 70%,#06070f)}
.leaf{position:absolute;top:18px;bottom:18px;width:calc(50% - 26px);transform-style:preserve-3d;transition:transform .85s cubic-bezier(.55,0,.2,1);z-index:5}
.leaf .pg{position:absolute;inset:0;backface-visibility:hidden;box-shadow:0 0 30px #000}.leaf .bc{transform:rotateY(180deg)}
.leaf.nx{left:calc(50% + 8px);transform-origin:left center}.leaf.nx.go{transform:rotateY(-180deg)}.leaf.pv{right:calc(50% + 8px);transform-origin:right center}.leaf.pv.go{transform:rotateY(180deg)}
@media(max-width:640px){.pg{gap:5px;padding:7px}.bk{padding:10px;gap:10px}.bk::before{display:none}}
.stage{position:relative;display:flex;gap:34px;justify-content:center;align-items:center;flex-wrap:wrap;padding:40px 16px;overflow:hidden;border-radius:20px}
.stage::before{content:"";position:absolute;width:560px;height:560px;left:50%;top:50%;margin:-280px;background:conic-gradient(from 0deg,transparent,#7b8fd655,transparent 20%,#7b8fd633,transparent 45%,#7b8fd655,transparent 70%);border-radius:50%;animation:spin 14s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}.stage>*{position:relative}
.pack{width:190px;aspect-ratio:3/4;border-radius:16px;background:linear-gradient(145deg,#3b3f91,#0e1020 55%,#7b8fd6);border:2px solid var(--ac);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 50px #3b3f9199;transform:perspective(700px) rotateY(-12deg) rotateX(6deg);animation:fl 3.5s ease-in-out infinite}
.pack img{width:84px;border-radius:50%;border:3px solid #fff;background:#fff}.pack b{letter-spacing:4px}.pack.big{width:min(260px,60vw)}
.pack::before{display:none}
@keyframes sw{from{left:-80px}to{left:300px}}@keyframes fl{50%{transform:perspective(700px) rotateY(-6deg) rotateX(3deg) translateY(-8px)}}
.pack.sh{animation:shk .1s infinite}@keyframes shk{25%{transform:rotate(-5deg) scale(1.06)}75%{transform:rotate(5deg) scale(1.1)}}
.rv{position:fixed;inset:0;z-index:70;overflow:auto;background:radial-gradient(circle at 50% 35%,#1a1f55,#030409 70%);display:flex;flex-direction:column;align-items:center;padding:60px 14px 30px;animation:vin .4s}.rw{margin:auto;display:flex;flex-direction:column;align-items:center;gap:22px}
.rt{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px}.rh{letter-spacing:.2em;text-transform:uppercase;color:var(--mu);font-size:13px;font-weight:700;text-align:center}
.rg{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;max-width:1100px}.rc{width:min(200px,27vw);animation:deal .7s cubic-bezier(.2,.8,.2,1) both}.rg.sm .rc{width:min(150px,28vw)}
@keyframes deal{from{opacity:0;transform:translateY(-90px) scale(.6) rotate(-8deg)}}
.flip{perspective:900px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.tp{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.rv button{touch-action:manipulation}.flip>div{position:relative;aspect-ratio:3/4;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden}.flip .f{transform:rotateY(180deg)}.flip .f .card{height:100%;width:100%;aspect-ratio:auto}
.flip .b{border-radius:12px}
.flip .hint .cb{border-color:var(--c);box-shadow:0 0 26px var(--c),inset 0 0 0 4px #0a0c2c;animation:hb 1.2s infinite alternate}@keyframes hb{to{box-shadow:0 0 6px var(--c)}}
.pl{display:block;margin:12px auto 0;width:fit-content;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.08em;opacity:0;transform:translateY(-8px);transition:.4s}.flip.on+.pl{opacity:1;transform:none}
.pl.n{background:#34d399;color:#04140d;box-shadow:0 0 16px #34d39988}.pl.d{background:#2a2f55;color:#ffd166}
.ra{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.w{background:#f1eff3;color:#111;border:0}
.fl{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,var(--c),transparent 62%);animation:fa .8s forwards;z-index:80}@keyframes fa{from{opacity:.75}to{opacity:0}}
.an{position:fixed;top:12%;left:0;right:0;text-align:center;font-size:clamp(28px,7vw,60px);font-weight:900;letter-spacing:.15em;color:var(--c);text-shadow:0 0 30px var(--c);animation:ann 1.7s forwards;pointer-events:none;z-index:85}
@keyframes ann{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.shk{animation:sk .5s}@keyframes sk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(5px,3px)}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px}.opt.ok{background:var(--ok);color:#000;border-color:var(--ok)}.opt.ko{background:var(--ko);border-color:var(--ko);animation:sk .4s}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .3s}
.cd{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:700}.big{font-size:40px;font-weight:900;color:#ffd166;animation:pop .6s}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#000;padding:10px 16px;border-radius:10px;font-weight:700;z-index:99}
#clv{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:center;background:#05080fdd;border:2px solid var(--lc);border-radius:18px;padding:8px 14px;box-shadow:0 0 34px color-mix(in srgb,var(--lc) 60%,transparent);animation:pop .5s,bob 3s ease-in-out infinite .5s}
#clv span{font-size:38px;filter:drop-shadow(0 0 8px var(--lc)) hue-rotate(var(--hr,0deg))}#clv b{font-size:18px;color:var(--lc)}#clv i{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums}
#clv.out{animation:out .5s forwards}@keyframes pop{from{transform:scale(0) rotate(-180deg)}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes out{to{transform:scale(0) rotate(180deg);opacity:0}}
.mdl{position:fixed;inset:0;background:#000c;z-index:95;display:flex;align-items:center;justify-content:center;padding:16px;animation:vin .25s}
.mb{background:var(--pn);border:1px solid var(--ln);border-radius:20px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:flex;gap:22px;flex-wrap:wrap;position:relative}
.mb .card{width:230px;flex:none;cursor:default}.mi{flex:1;min-width:250px}.mi table{width:100%;border-collapse:collapse;margin:10px 0}.mi td{padding:8px 4px;border-bottom:1px solid var(--ln)}.mi td:last-child{text-align:right;font-weight:700}
.xx{position:absolute;top:10px;right:10px}.ow{max-height:170px;overflow:auto;font-size:14px}.ow div{padding:6px 0;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:8px}
textarea{width:100%;min-height:80px}table.l{width:100%;border-collapse:collapse}.l td{padding:10px 6px;border-bottom:1px solid var(--ln)}.sc{overflow-x:auto}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.f2 label,label.mut{font-size:12px;color:var(--mu);display:block}.f2 input{width:100%}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:8px}
.st{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.st button.on{background:var(--ac2);border-color:var(--ac)}

.lg span{background:linear-gradient(90deg,#fff,#9fb0ff,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fo 6s linear infinite}
.p{border-top-color:#3b4290}
.cb{container-type:inline-size;position:absolute;inset:0;border-radius:12px;border:2px solid #7b8fd6;overflow:hidden;background:radial-gradient(circle at 50% 44%,#4350c4 0,#1b2064 34%,#0a0c2c 72%);box-shadow:inset 0 0 0 4px #0a0c2c,inset 0 0 0 5px #7b8fd688,0 0 18px #3b3f9166}
.cb::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 44%,#ffffff12 0 5deg,transparent 5deg 10deg);mask:radial-gradient(circle at 50% 44%,#000 15%,transparent 75%)}
.cb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff26 48%,transparent 60%);background-size:260% 100%;animation:fo 5s ease-in-out infinite;pointer-events:none}
.cb i{position:absolute;left:50%;top:44%;border-radius:50%;border:1px solid #9fb0ff66;transform:translate(-50%,-50%)}.cb .r1{width:80cqw;height:80cqw}.cb .r2{width:62cqw;height:62cqw;border:2px solid #b9c5ff88;box-shadow:0 0 20px #7b8fd6aa,inset 0 0 20px #7b8fd655}
.cb img{position:absolute;left:50%;top:44%;width:46cqw;height:46cqw;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:#fff;box-shadow:0 0 22px #9fb0ffaa}
.cb b{position:absolute;left:0;right:0;bottom:15cqw;text-align:center;letter-spacing:.35em;padding-left:.35em;font-size:11cqw;text-shadow:0 0 14px #7b8fd6}
.cb small{position:absolute;left:0;right:0;bottom:8.5cqw;text-align:center;font-size:4.4cqw;letter-spacing:.3em;color:#9fb0ff}
.cb s{position:absolute;text-decoration:none;color:#9fb0ff;font-size:6cqw}
.fo{position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,transparent 35%,#ffffff2e 46%,#8ff4ff26 50%,#ff9ae626 54%,transparent 65%);background-size:260% 100%;animation:fo 5s ease-in-out infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes fo{0%{background-position:120% 0}100%{background-position:-120% 0}}
.card::before{content:"";position:absolute;inset:3cqw;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:8px;pointer-events:none;z-index:2}
.dv{display:block;height:1px;margin:2.5cqw 12cqw 0;background:linear-gradient(90deg,transparent,var(--c),transparent);position:relative}.dv::after{content:"";position:absolute;left:50%;top:-2.5px;width:6px;height:6px;margin-left:-3px;background:var(--c);transform:rotate(45deg)}
.pack::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(90deg,#c9d2ff 0 4px,#6f7fd0 4px 8px) top/100% 9px no-repeat,repeating-linear-gradient(90deg,#c9d2ff 0 4px,#6f7fd0 4px 8px) bottom/100% 9px no-repeat}
.pg .card{transition:transform .25s,box-shadow .25s}.pg .card:hover{transform:translateY(-4px) scale(1.04)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero img{width:92px;height:92px;border-radius:50%;border:3px solid var(--ac);background:#fff;box-shadow:0 0 40px #7b8fd6aa;animation:fl2 4s ease-in-out infinite}@keyframes fl2{50%{transform:translateY(-6px) rotate(2deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stats div{background:#14172ecc;border:1px solid var(--ln);border-radius:14px;padding:12px 14px}.stats span{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}.stats b{font-size:22px}
.blk{position:fixed;inset:0;z-index:120;background:#000;opacity:0;transition:opacity .8s;display:flex;align-items:center;justify-content:center;color:#fff}.blk.on{opacity:1}
.blk.on::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:hbt .6s infinite}@keyframes hbt{0%{box-shadow:0 0 0 0 #fff9}100%{box-shadow:0 0 0 70px #fff0}}
.mc{width:230px;flex:none;text-align:center}.mc .card{width:100%}.rar{margin-top:12px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;font-size:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv div{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.kv span{display:block;font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase}.kv b{font-size:17px}
.ow div{align-items:center;padding:7px 6px}.ow .me{background:#3b3f9144;border-radius:8px}.ow .nm{flex:1}.ow .av{width:26px;height:26px;font-size:12px;margin-right:8px;flex:none}
@media(max-width:560px){.stats b{font-size:17px}.hero img{width:64px;height:64px}}

.ic{vertical-align:-3px;flex:none}button .ic{margin:-2px 2px 0 0}
.hero2{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;border-radius:22px;padding:28px;margin-bottom:14px;border:1px solid #3b4290;background:linear-gradient(125deg,#1e2466e6,#0b0d26ee 60%),radial-gradient(circle at 85% 20%,#7b8fd655,transparent 55%)}
